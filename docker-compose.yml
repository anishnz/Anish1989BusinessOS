# Runs the whole platform from pre-built images, so every laptop gets the same versions.
#
# Easiest start:  Windows  ->  .\start.ps1
#                 Mac/Linux ->  ./start.sh
# Manual start:   copy .env.example to .env, edit it, then `docker compose up -d`
#
# The app image is built and published by GitHub Actions on every push to main:
#   ghcr.io/anishnz/anish1989businessos-backend
# If it cannot be pulled, Docker builds it locally from ./backend and ./frontend instead.

x-app: &app
  image: ghcr.io/anishnz/anish1989businessos-backend:${APP_IMAGE_TAG:-latest}
  build:
    context: ./backend
    additional_contexts:
      frontend-src: ./frontend   # the React staff app, built inside the image
      guide-src: ./docs/user-guide   # the user guide shown at /guide/
  env_file: .env
  restart: unless-stopped
  volumes:
    # Encrypted backups (task 1.14). Also copy them off this computer: Google Drive (Backups page).
    - backups_data:/app/backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-businessos}
      POSTGRES_USER: ${POSTGRES_USER:-businessos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-H", "Host: localhost", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  scheduler:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  # HTTPS for a real server (task 2.8). Not started on a laptop; on a server run:
  #   docker compose --profile server up -d
  # Needs ports 80 and 443 open, ACME_EMAIL in .env, and DNS of the platform domain pointing here.
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["server"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  backups_data:
