<style>
  .tk { --ink: var(--body-fg); --ink-2: var(--body-quiet-color); --grid: var(--hairline-color);
        --ok: #0a7d0a; --ok-bg: #e6f4e6; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b42323; --bad-bg: #fbe5e5; --none: #5c6370; --none-bg: #eceef1; --info: #1f5fa8; --info-bg: #e3eefb;
        max-width: 1000px; color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .tk {
        --ok: #6fd36f; --ok-bg: #173a17; --warn: #f0c060; --warn-bg: #3d3010; --bad: #ff8a8a; --bad-bg: #451c1c; --none: #b5bcc6; --none-bg: #2c3038; --info: #8cc1ff; --info-bg: #14304f; } }
  :root[data-theme="dark"] .tk { --ok: #6fd36f; --ok-bg: #173a17; --warn: #f0c060; --warn-bg: #3d3010; --bad: #ff8a8a; --bad-bg: #451c1c; --none: #b5bcc6; --none-bg: #2c3038; --info: #8cc1ff; --info-bg: #14304f; }
  .tk .note { color: var(--ink-2); font-size: 13px; }
  .tk .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tk .s-new { color: var(--info); background: var(--info-bg); } .tk .s-in_progress { color: var(--warn); background: var(--warn-bg); }
  .tk .s-waiting { color: var(--none); background: var(--none-bg); } .tk .s-resolved, .tk .s-closed { color: var(--ok); background: var(--ok-bg); }
  .tk .p-urgent { color: var(--bad); background: var(--bad-bg); } .tk .p-high { color: var(--warn); background: var(--warn-bg); }
  .tk .p-normal, .tk .p-low { color: var(--none); background: var(--none-bg); }
  .tk .overdue { color: var(--bad); font-weight: 600; }
  .tk .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 14px; }
  .tk .tabs a { padding: 4px 10px; border-radius: 6px; text-decoration: none; }
  .tk .tabs a.on { background: var(--none-bg); font-weight: 600; }
  .tk .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; border: 1px solid var(--grid); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .tk .stats b { font-size: 18px; }
  .tk .card { border: 1px solid var(--grid); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .tk .card h2 { font-size: 15px; margin: 0 0 8px; background: none; color: var(--ink); padding: 0; text-transform: none; letter-spacing: 0; }
  .tk .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .tk .msg { border-left: 3px solid var(--grid); padding: 6px 12px; margin: 10px 0; }
  .tk .msg.internal { border-left-color: var(--warn); background: var(--warn-bg); }
  .tk .msg .who { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .tk form.inline { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin: 8px 0 0; }
  .tk form.inline label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .tk textarea { width: 100%; box-sizing: border-box; }
  .tk .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); gap: 16px; }
  .tk dl { margin: 0; } .tk dt { font-size: 12px; color: var(--ink-2); margin-top: 8px; } .tk dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .tk table { width: 100%; border-collapse: collapse; }
  .tk td, .tk th { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
  .tk .form-row { margin-bottom: 12px; } .tk .form-row label { display: block; font-weight: 600; margin-bottom: 4px; }
  .tk .form-row input[type=text], .tk .form-row select { width: 100%; max-width: 520px; box-sizing: border-box; }
  @media (max-width: 760px) {
    .tk .grid { grid-template-columns: 1fr; }
    .tk table, .tk tbody, .tk tr, .tk td { display: block; width: auto; }
    .tk thead { display: none; }
    .tk tr { border-bottom: 1px solid var(--grid); padding: 6px 0; } .tk td { border: 0; padding: 2px 0; }
  }
</style>
