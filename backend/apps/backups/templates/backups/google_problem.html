<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Google Drive was not connected</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --quiet: #59636e; --line: #d1d9e0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --quiet: #9198a1; --line: #3d444d; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { margin: 0 0 12px; overflow-wrap: anywhere; }
    .quiet { color: var(--quiet); font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Google Drive was not connected</h1>
    <p>{{ problem }}</p>
    <p class="quiet">Go back to your Backups page and click “Connect Google Drive” again. Nothing was changed.</p>
  </main>
</body>
</html>
